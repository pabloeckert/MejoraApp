name: Onboarding Emails (cron)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  send-emails:
    name: Send onboarding emails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger send-onboarding-email
        run: |
          # Capture body and HTTP status code separately to avoid blind JSON parse failures.
          # Previous version piped curl -s directly to python3 json.load(sys.stdin), which
          # raised JSONDecodeError when the Edge Function returned an empty body (function
          # not deployed, SUPABASE_SERVICE_ROLE_KEY missing/expired, cold-start timeout).
          # This version gives a clear, actionable error for each failure mode.

          HTTP_STATUS=$(curl -s \
            -o /tmp/ef_response.json \
            -w "%{http_code}" \
            -X POST \
            "${VITE_SUPABASE_URL}/functions/v1/send-onboarding-email" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json")

          BODY=$(cat /tmp/ef_response.json 2>/dev/null || echo "")

          echo "HTTP Status : $HTTP_STATUS"
          echo "Response    : $BODY"

          # Fail fast if the function is unreachable or returned an HTTP error
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Edge Function returned HTTP $HTTP_STATUS"
            echo "::error::Body: $BODY"
            echo "::error::Possible causes:"
            echo "::error::  - SUPABASE_SERVICE_ROLE_KEY secret missing or expired in repo Settings"
            echo "::error::  - VITE_SUPABASE_URL secret missing in repo Settings"
            echo "::error::  - Edge Function 'send-onboarding-email' not deployed in Supabase"
            echo "::error::  - Supabase project paused (free tier auto-pause)"
            exit 1
          fi

          # Guard against empty body before attempting JSON parse
          if [ -z "$BODY" ]; then
            echo "::error::Edge Function returned HTTP $HTTP_STATUS but with an EMPTY body"
            echo "::error::Verify the function is deployed and returns a JSON object"
            exit 1
          fi

          # Parse and display results
          python3 << 'PYEOF'
          import json, sys, os

          body = open("/tmp/ef_response.json").read().strip()

          try:
              d = json.loads(body)
          except json.JSONDecodeError as e:
              print(f"::error::JSON parse failed: {e}")
              print(f"::error::Raw response was: {repr(body)}")
              sys.exit(1)

          sent   = d.get("sent",   d.get("Sent",   0))
          failed = d.get("failed", d.get("Failed", 0))
          total  = d.get("total",  d.get("Total",  0))

          print(f"Sent: {sent} | Failed: {failed} | Total: {total}")
          if failed > 0:
              print(f"::warning::{failed}/{total} emails failed — check Edge Function logs in Supabase dashboard")
          PYEOF
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
